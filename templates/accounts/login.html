<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Student Management System</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-2xl shadow-lg p-8">

            <!-- Header -->
            <div class="text-center mb-8">

                <div class="w-14 h-14 bg-blue-900 text-white rounded-xl
                            flex items-center justify-center
                            mx-auto mb-4">

                    <span class="text-2xl font-bold">S</span>

                </div>

                <h1 class="text-2xl font-bold text-slate-800">
                    Student Management System
                </h1>

                <p class="text-slate-500 mt-2">
                    Login to your account
                </p>

            </div>


            <!-- Error Messages -->
            {% if messages %}

                {% for message in messages %}

                    <div class="bg-red-100 border border-red-200
                                text-red-700 px-4 py-3 rounded-lg mb-5">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}


            <!-- Login Form -->
            <form method="POST">

                {% csrf_token %}

                <!-- Username -->
                <div class="mb-5">

                    <label class="block text-sm font-medium
                                  text-slate-700 mb-2">

                        Username

                    </label>

                    <input
                        type="text"
                        name="username"
                        required
                        autofocus
                        class="w-full px-4 py-3 border border-slate-300
                               rounded-lg outline-none
                               focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter your username"
                    >

                </div>


                <!-- Password -->
                <div class="mb-6">

                    <label class="block text-sm font-medium
                                  text-slate-700 mb-2">

                        Password

                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        class="w-full px-4 py-3 border border-slate-300
                               rounded-lg outline-none
                               focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter your password"
                    >

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full bg-blue-900 text-white
                           py-3 rounded-lg font-semibold
                           hover:bg-blue-800 transition">

                    Login

                </button>

            </form>

        </div>

        <p class="text-center text-sm text-slate-500 mt-5">
            Student Management and Fee Payment System
        </p>

    </div>

</body>

</html>
