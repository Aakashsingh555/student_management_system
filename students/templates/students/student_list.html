<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>

    <h1>Student Management</h1>

    <a href="{% url 'student_create' %}">Add New Student</a>

    <hr>

    {% if students %}
        <table border="1" cellpadding="10">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>

            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.phone }}</td>
                <td>{{ student.course }}</td>
                <td>
                    <a href="{% url 'student_update' student.id %}">Edit</a>
                    |
                    <a href="{% url 'student_delete' student.id %}">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No students found.</p>
    {% endif %}

</body>
</html>
